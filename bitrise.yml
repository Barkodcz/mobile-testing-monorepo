# Root Bitrise config. It only wires things together:
# every platform lives in its own module under bitrise/, merged in via `include`.
# Config modules need the config stored in the repo (not on bitrise.io) and an Enterprise plan.
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

# Default machine for workflows that don't set their own (Linux is cheaper than macOS).
# Check current stack names at https://stacks.bitrise.io
meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: g2.linux.medium

include:
- path: bitrise/ios.yml
- path: bitrise/android.yml
- path: bitrise/react-native.yml
- path: bitrise/flutter.yml
- path: bitrise/e2e.yml

# Reusable Step sequences, shared across every included module (see
# docs/BITRISE_CONCEPTS.md "Step bundles" section for the full writeup of
# what each one replaces and why it lives here rather than in one module).
step_bundles:
  # Just avd-manager, not also wait-for-android-emulator -- several
  # workflows deliberately run other steps (building the APK, assigning a
  # shard's flow files) *between* creating the AVD and waiting for it to
  # finish booting, to overlap boot time with other work. Bundling the wait
  # in too would force them adjacent and serialize that overlap away, so
  # each call site still adds its own `wait-for-android-emulator@1.0.10: {}`
  # wherever it already belonged.
  android_avd_create:
    inputs:
    - avd_profile: pixel_6
    - avd_api_level: "34"
    - avd_tag: google_apis
    - avd_abi: x86_64
    steps:
    - avd-manager@2.2.0:
        inputs:
        - profile: $avd_profile
        - api_level: $avd_api_level
        - tag: $avd_tag
        - abi: $avd_abi

  ios_simulator_boot:
    steps:
    - script@1.2.1:
        title: Boot simulator
        inputs:
        - content: |
            xcrun simctl boot "Bitrise iOS default" 2>/dev/null || true
            xcrun simctl bootstatus "Bitrise iOS default" -b

app:
  envs:
  - IOS_DIR: apps/ios
  - ANDROID_DIR: apps/android
  - RN_DIR: apps/react-native
  - FLUTTER_DIR: apps/flutter
  # Controls video recording across every UI/E2E test suite: all | failures | off.
  # Where a framework supports "keep only on failure" natively (Detox, Patrol),
  # this maps to it directly. Where it doesn't, scripts/recording helpers delete
  # the video for passing tests before export. Default: all -- this repo's goal
  # is to showcase as much recorded evidence as possible, so every run's video
  # is kept and attached to the Tests tab regardless of pass/fail.
  - RECORD_VIDEO: all
  # One cheap device by default for android-espresso-vdt (Virtual Device
  # Testing / Firebase Test Lab); override in the Bitrise UI for more
  # devices/OS versions. Format: deviceID,version,language,orientation per line.
  - VDT_DEVICE_LIST: "SmallPhone.arm,30,en,portrait"
  # Scenario 3a: number of shards for the ios_xcuitest_sharded pipeline.
  # CounterApp-UI only has 2 test methods, so there's little point going
  # higher by default -- override in the Bitrise UI to demonstrate more.
  - XCUITEST_SHARD_COUNT: "2"
  # Scenario 3b: number of shards for the android_maestro_sharded pipeline.
  # Default 3 per the task spec, even though e2e/maestro/ only has 2 flow
  # files -- one shard legitimately runs 0 flows at this default, see
  # docs/new-test-scenarios-plan.md.
  - MAESTRO_SHARD_COUNT: "3"

# Manual-only pipeline that runs every fast suite at once (no triggers).
# Start it from the Bitrise UI: Start build > Pipeline > everything_fast.
pipelines:
  everything_fast:
    workflows:
      ios_unit_tests: {}
      android_unit_tests: {}
      android_snapshot_tests: {}
      rn_jest_tests: {}
      flutter_tests: {}
