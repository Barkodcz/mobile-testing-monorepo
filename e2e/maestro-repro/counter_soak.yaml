appId: io.bitrise.sample.counter
---
# Sustained ADB/UI traffic plus repeated pm clear, roughly approximating a
# long login/checkout-style flow.
- repeat:
    times: 40
    commands:
      - launchApp:
          clearState: true
      # Right after the video flow the device can still be under load, so a
      # cold start post-clearState can be slower than Maestro's default
      # assertVisible timeout (~17s) -- give it more headroom here.
      - assertVisible:
          text: "Count: 0"
          timeout: 30000
      - tapOn:
          id: "increment_button"
      - tapOn:
          id: "increment_button"
      - assertVisible: "Count: 2"
      - tapOn: "Reset"
      - assertVisible: "Count: 0"
