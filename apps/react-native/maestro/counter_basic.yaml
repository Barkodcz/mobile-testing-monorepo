# Same journey as the Detox test "shows the initial count" + part of
# "increments and resets" in apps/react-native/e2e/counter.e2e.js -- see
# maestro/README.md for the full mapping.
#
# appId is parameterized via ${MAESTRO_APP_ID} -- `maestro test` has no
# --app-id flag (confirmed live: "Unknown option: '--app-id'"), so each
# workflow passes its platform's app id with `-e MAESTRO_APP_ID=...` via the
# Step's additional_args input, letting one flow file cover both platforms.
appId: ${MAESTRO_APP_ID}
name: Counter starts at zero and increments
---
- startRecording: recording
- launchApp:
    clearState: true
- assertVisible: "Count: 0"
- tapOn:
    id: "increment_button"
- tapOn:
    id: "increment_button"
- assertVisible: "Count: 2"
- takeScreenshot: after_increment
- stopRecording
