# XcodeGen spec: `xcodegen generate` turns this into CounterApp.xcodeproj.
# Keeping the project as YAML avoids merge conflicts in .pbxproj files.
name: CounterApp
options:
  bundleIdPrefix: io.bitrise.sample
  deploymentTarget:
    iOS: "17.0"
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  CounterApp:
    type: application
    platform: iOS
    sources: [CounterApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bitrise.sample.counter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  CounterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CounterAppTests]
    dependencies:
      - target: CounterApp
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CounterAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CounterAppUITests]
    dependencies:
      - target: CounterApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CounterApp
schemes:
  # Unit + snapshot tests only: fast, runs on every pull request.
  CounterApp-Unit:
    build:
      targets:
        CounterApp: all
    test:
      config: Debug
      targets: [CounterAppTests]
  # XCUITest UI tests only: slower, runs in its own workflow.
  CounterApp-UI:
    build:
      targets:
        CounterApp: all
    test:
      config: Debug
      targets: [CounterAppUITests]
