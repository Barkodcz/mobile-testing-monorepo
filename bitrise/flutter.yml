# Flutter module: unit, widget and golden tests; integration_test on an Android emulator.
format_version: "13"

pipelines:
  flutter:
    workflows:
      flutter_tests: {}
      flutter_integration_tests:
        depends_on: [flutter_tests]
      flutter_patrol_android:
        depends_on: [flutter_tests]
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^(apps/flutter/.*|bitrise/flutter\.yml)$'
      pull_request:
      - draft_enabled: false
        changed_files:
          regex: '^(apps/flutter/.*|bitrise/flutter\.yml)$'

workflows:
  _flutter_setup:
    steps:
    - git-clone@8.5.2: {}
    - flutter-installer@1.1.1:
        inputs:
        - version: stable
    - restore-dart-cache@3.0.2: {}

  flutter_tests:
    summary: >
      Unit, widget and golden tests with flutter test (no device). Switched
      from the native Flutter Test Step to a script + the generic export
      route so a golden mismatch's diff image can be attached to its exact
      failing test case (see docs/test-recording-plan.md) -- no video here,
      golden tests are a still-image diff, not a live screen.
    before_run: [_flutter_setup]
    steps:
    - script@1.2.1:
        title: Run flutter test
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -o pipefail
            dart pub global activate junitreport
            mkdir -p test-results
            flutter test --machine | dart pub global run junitreport:tojunit --output test-results/flutter.xml
    - script@1.2.1:
        title: Attach golden diff image (if any test failed)
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            DIFF_PNG="$(ls test/goldens/failures/*.png 2>/dev/null | head -n1 || true)"
            if [ -n "$DIFF_PNG" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" attach-to-first-failure \
                --junit-xml test-results/flutter.xml --media "$DIFF_PNG" --label golden_diff --dest-dir test-results
            else
              echo "No golden failure image found, nothing to attach."
            fi
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Flutter tests
        - base_path: $BITRISE_SOURCE_DIR/apps/flutter/test-results
        - search_pattern: "*/flutter.xml"
    - save-dart-cache@1.1.1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  flutter_record_goldens:
    summary: Manual helper. Records golden images on Linux so you can download and commit them.
    before_run: [_flutter_setup]
    steps:
    - script@1.2.1:
        title: Record goldens
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            flutter pub get
            flutter test --update-goldens test/goldens
            cp test/goldens/*.png "$BITRISE_DEPLOY_DIR/"
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  flutter_integration_tests:
    summary: integration_test on an Android emulator, converted to JUnit XML.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large
    before_run: [_flutter_setup]
    steps:
    - avd-manager@2.2.0:
        inputs:
        - profile: pixel_6
        - api_level: "34"
        - tag: google_apis
        - abi: x86_64
    - wait-for-android-emulator@1.0.10: {}
    - script@1.2.1:
        title: Start screen recording
        inputs:
        - content: $BITRISE_SOURCE_DIR/scripts/recording/start-android.sh /sdcard/bitrise-recordings integration-test
    - script@1.2.1:
        title: Run integration_test
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -o pipefail
            # Platform folders are generated if they were not committed.
            [ -d android ] || flutter create . --platforms=android,ios --org io.bitrise.sample --project-name counter_flutter
            flutter pub get
            dart pub global activate junitreport
            mkdir -p test-results
            flutter test integration_test -d "$BITRISE_EMULATOR_SERIAL" --machine \
              | dart pub global run junitreport:tojunit --output test-results/integration.xml
    - script@1.2.1:
        title: Stop screen recording
        is_always_run: true
        inputs:
        - content: |
            SCREENSHOT="$($BITRISE_SOURCE_DIR/scripts/recording/screenshot-android.sh \
              $BITRISE_SOURCE_DIR/recordings/integration-test-final.png)"
            [ -n "$SCREENSHOT" ] && echo "Took a final-state screenshot: $SCREENSHOT"
            $BITRISE_SOURCE_DIR/scripts/recording/stop-android.sh /sdcard/bitrise-recordings $BITRISE_SOURCE_DIR/recordings
    - script@1.2.1:
        title: Attach the recording and screenshot
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            RECORDING="$("$BITRISE_SOURCE_DIR/scripts/recording/concat-chunks.sh" \
              "$BITRISE_SOURCE_DIR/recordings/bitrise-recordings/integration-test_chunk*.mp4" \
              "$BITRISE_SOURCE_DIR/recordings/integration-test_combined.mp4")"
            if [ -n "$RECORDING" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" add-recording-testcase \
                --junit-xml test-results/integration.xml \
                --classname counter_flutter.integration_test.app_test \
                --media "$RECORDING" \
                --dest-dir test-results
            else
              echo "No recording found, exporting test results without a video attachment."
            fi
            if [ -s "$BITRISE_SOURCE_DIR/recordings/integration-test-final.png" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" add-recording-testcase \
                --junit-xml test-results/integration.xml \
                --classname counter_flutter.integration_test.app_test \
                --media "$BITRISE_SOURCE_DIR/recordings/integration-test-final.png" \
                --label screenshot --always \
                --dest-dir test-results
            fi
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Flutter integration tests
        - base_path: $BITRISE_SOURCE_DIR/apps/flutter/test-results
        - search_pattern: "*/integration.xml"
    - save-dart-cache@1.1.1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  flutter_patrol_android:
    summary: Patrol tests (Flutter + native interactions) on an Android emulator.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large
    before_run: [_flutter_setup]
    steps:
    - avd-manager@2.2.0:
        inputs:
        - profile: pixel_6
        - api_level: "34"
        - tag: google_apis
        - abi: x86_64
    - script@1.2.1:
        title: Prepare Android project for Patrol
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            # Platform folders are generated if they were not committed.
            [ -d android ] || flutter create . --platforms=android,ios --org io.bitrise.sample --project-name counter_flutter
            python3 tool/patrol_setup_android.py      # no-op if already applied
            flutter pub get
            dart pub global activate patrol_cli 4.8.0
            envman add --key PATH --value "$PATH:$HOME/.pub-cache/bin"   # keep the CLI on PATH for later steps
    - wait-for-android-emulator@1.0.10: {}
    - script@1.2.1:
        title: Start screen recording
        inputs:
        - content: $BITRISE_SOURCE_DIR/scripts/recording/start-android.sh /sdcard/bitrise-recordings patrol
    - script@1.2.1:
        title: Run Patrol tests
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            export PATH="$PATH:$HOME/.pub-cache/bin"
            patrol test --device "$BITRISE_EMULATOR_SERIAL" --verbose
    - script@1.2.1:
        title: Stop screen recording
        is_always_run: true
        inputs:
        - content: $BITRISE_SOURCE_DIR/scripts/recording/stop-android.sh /sdcard/bitrise-recordings $BITRISE_SOURCE_DIR/recordings
    - script@1.2.1:
        title: Collect Patrol JUnit XML and reports
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            mkdir -p test-results
            # Patrol runs Gradle connected tests; AGP writes one XML per device here.
            npx --yes junit-report-merger test-results/patrol.xml "build/app/outputs/androidTest-results/**/*.xml"
            # deploy-to-bitrise-io only picks up files in the deploy dir, not raw
            # copied directories, so zip these instead of cp -r.
            zip -qr "$BITRISE_DEPLOY_DIR/patrol-html-report.zip" build/app/reports/androidTests 2>/dev/null || true
            # Patrol pulls screenshots (on-demand + screenshot_on_failure) to
            # test_directory/screenshots/<classname>/<name>/<timestamp>_<label>.png --
            # that <classname>/<name> already matches the JUnit testcase exactly, so
            # attach each one to its real test case instead of only zipping them.
            zip -qr "$BITRISE_DEPLOY_DIR/patrol-screenshots.zip" patrol_test/screenshots 2>/dev/null || true
            if [ -d patrol_test/screenshots ]; then
              find patrol_test/screenshots -type f -name "*.png" | while read -r f; do
                test_name="$(basename "$(dirname "$f")")"
                test_classname="$(basename "$(dirname "$(dirname "$f")")")"
                label="$(basename "$f" .png | sed -E 's/^[0-9]+_//')"
                python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" rename \
                  --classname "$test_classname" --name "$test_name" --media "$f" \
                  --label "$label" --dest-dir test-results
              done
            fi
            RECORDING="$("$BITRISE_SOURCE_DIR/scripts/recording/concat-chunks.sh" \
              "$BITRISE_SOURCE_DIR/recordings/bitrise-recordings/patrol_chunk*.mp4" \
              "$BITRISE_SOURCE_DIR/recordings/patrol_combined.mp4")"
            if [ -n "$RECORDING" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" add-recording-testcase \
                --junit-xml test-results/patrol.xml \
                --classname io.bitrise.sample.counter_flutter.MainActivityTest \
                --media "$RECORDING" \
                --dest-dir test-results
            else
              echo "No recording found, exporting test results without a video attachment."
            fi
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Patrol (Android)
        - base_path: $BITRISE_SOURCE_DIR/apps/flutter/test-results
        - search_pattern: "*/patrol.xml"
    - save-dart-cache@1.1.1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
