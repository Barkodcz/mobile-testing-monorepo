# Flutter module: unit, widget and golden tests; integration_test on an Android emulator.
format_version: "13"

pipelines:
  flutter:
    workflows:
      flutter_tests: {}
      flutter_integration_tests:
        depends_on: [flutter_tests]
      flutter_patrol_android:
        depends_on: [flutter_tests]
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^(apps/flutter/.*|bitrise/flutter\.yml)$'
      pull_request:
      - draft_enabled: false
        changed_files:
          regex: '^(apps/flutter/.*|bitrise/flutter\.yml)$'

workflows:
  _flutter_setup:
    steps:
    - git-clone@8: {}
    - flutter-installer@0:
        inputs:
        - version: stable
    - restore-dart-cache@1: {}

  flutter_tests:
    summary: Unit, widget and golden tests with flutter test (no device).
    before_run: [_flutter_setup]
    steps:
    - flutter-test@1:                     # exports to the Tests tab automatically
        inputs:
        - project_location: $BITRISE_SOURCE_DIR/apps/flutter
    - script@1:
        title: Keep golden failure images
        is_always_run: true
        inputs:
        - content: cp -r apps/flutter/test/goldens/failures "$BITRISE_DEPLOY_DIR/golden-failures" 2>/dev/null || true
    - save-dart-cache@1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  flutter_record_goldens:
    summary: Manual helper. Records golden images on Linux so you can download and commit them.
    before_run: [_flutter_setup]
    steps:
    - script@1:
        title: Record goldens
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            flutter pub get
            flutter test --update-goldens test/goldens
            cp test/goldens/*.png "$BITRISE_DEPLOY_DIR/"
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  flutter_integration_tests:
    summary: integration_test on an Android emulator, converted to JUnit XML.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large
    before_run: [_flutter_setup]
    steps:
    - avd-manager@1:
        inputs:
        - profile: pixel_6
        - api_level: "34"
        - tag: google_apis
        - abi: x86_64
    - wait-for-android-emulator@1: {}
    - script@1:
        title: Run integration_test
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            # Platform folders are generated if they were not committed.
            [ -d android ] || flutter create . --platforms=android,ios --org io.bitrise.sample --project-name counter_flutter
            flutter pub get
            dart pub global activate junitreport
            mkdir -p test-results
            flutter test integration_test -d "$BITRISE_EMULATOR_SERIAL" --machine \
              | dart pub global run junitreport:tojunit --output test-results/integration.xml
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Flutter integration tests
        - base_path: $BITRISE_SOURCE_DIR/apps/flutter/test-results
        - search_pattern: "*/integration.xml"
    - save-dart-cache@1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  flutter_patrol_android:
    summary: Patrol tests (Flutter + native interactions) on an Android emulator.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large
    before_run: [_flutter_setup]
    steps:
    - avd-manager@1:
        inputs:
        - profile: pixel_6
        - api_level: "34"
        - tag: google_apis
        - abi: x86_64
    - script@1:
        title: Prepare Android project for Patrol
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            # Platform folders are generated if they were not committed.
            [ -d android ] || flutter create . --platforms=android,ios --org io.bitrise.sample --project-name counter_flutter
            python3 tool/patrol_setup_android.py      # no-op if already applied
            flutter pub get
            dart pub global activate patrol_cli 4.8.0
            envman add --key PATH --value "$PATH:$HOME/.pub-cache/bin"   # keep the CLI on PATH for later steps
    - wait-for-android-emulator@1: {}
    - script@1:
        title: Run Patrol tests
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            export PATH="$PATH:$HOME/.pub-cache/bin"
            patrol test --device "$BITRISE_EMULATOR_SERIAL" --verbose
    - script@1:
        title: Collect Patrol JUnit XML and reports
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/flutter
        - content: |
            set -eo pipefail
            mkdir -p test-results
            # Patrol runs Gradle connected tests; AGP writes one XML per device here.
            npx --yes junit-report-merger test-results/patrol.xml "build/app/outputs/androidTest-results/**/*.xml"
            # deploy-to-bitrise-io only picks up files in the deploy dir, not raw
            # copied directories, so zip these instead of cp -r.
            zip -qr "$BITRISE_DEPLOY_DIR/patrol-html-report.zip" build/app/reports/androidTests 2>/dev/null || true
            # Patrol pulls screenshots (on-demand + screenshot_on_failure) to test_directory/screenshots.
            zip -qr "$BITRISE_DEPLOY_DIR/patrol-screenshots.zip" patrol_test/screenshots 2>/dev/null || true
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Patrol (Android)
        - base_path: $BITRISE_SOURCE_DIR/apps/flutter/test-results
        - search_pattern: "*/patrol.xml"
    - save-dart-cache@1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
