# iOS module: Swift Testing unit tests, swift-snapshot-testing, XCUITest.
format_version: "13"

pipelines:
  ios:
    workflows:
      ios_unit_tests: {}
      ios_ui_tests: {}
      # ios_ui_tests_manual is deliberately NOT included here: it's a
      # manual-trigger-only demonstration of the alternative (full-control)
      # approach to recording XCUITest runs, see docs/test-recording-plan.md.
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^(apps/ios/.*|bitrise/ios\.yml)$'
      pull_request:
      - draft_enabled: false
        changed_files:
          regex: '^(apps/ios/.*|bitrise/ios\.yml)$'

  # Scenario 3a: build the CounterApp-UI test bundle once, shard it, run the
  # shards in parallel, each reporting its own Tests tab entry. Start this
  # PIPELINE from the Bitrise UI (not any one of its workflows directly).
  # See docs/new-test-scenarios-plan.md.
  ios_xcuitest_sharded:
    workflows:
      ios-xcuitest-shard-build: {}
      ios-xcuitest-shard-calc:
        depends_on: [ios-xcuitest-shard-build]
      ios-xcuitest-shard-1:
        depends_on: [ios-xcuitest-shard-calc]
      ios-xcuitest-shard-2:
        depends_on: [ios-xcuitest-shard-calc]

workflows:
  _ios_setup:
    summary: Clone the repo and generate the Xcode project with XcodeGen.
    steps:
    - git-clone@8: {}
    - script@1:
        title: Generate Xcode project (XcodeGen)
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/ios
        - content: |
            set -eo pipefail
            brew install xcodegen
            xcodegen generate

  ios_unit_tests:
    summary: Unit tests (Swift Testing) and snapshot tests (swift-snapshot-testing).
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x          # check https://stacks.bitrise.io
        machine_type_id: g2.mac.medium
    before_run: [_ios_setup]
    steps:
    - xcode-test@6:                       # exports to the Tests tab automatically
        inputs:
        - project_path: apps/ios/CounterApp.xcodeproj
        - scheme: CounterApp-Unit
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - script@1:
        title: Keep snapshot reference images
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/ios/CounterAppTests
        - content: |
            # First run records missing references here; download and commit them.
            if [ -d __Snapshots__ ]; then zip -qr "$BITRISE_DEPLOY_DIR/ios-snapshots.zip" __Snapshots__; fi
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios_ui_tests:
    summary: >
      XCUITest UI tests on an iOS simulator ("Approach A": keep the native
      Xcode Test Step, pre-boot the simulator ourselves so simctl can record
      it). Screenshots XCTest itself captures on failure still auto-attach
      via xcresult, same as before -- but the externally recorded video
      can only be deployed as a plain build artifact, NOT attached to a
      Tests tab test case, since xcresult's attachment matching only covers
      attachments the test process captured through XCTest's own API, not
      files recorded from outside it. See ios_ui_tests_manual for the
      approach that gets a true Tests-tab video attachment. More in
      docs/test-recording-plan.md.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    before_run: [_ios_setup]
    steps:
    - script@1:
        title: Boot simulator and start recording
        inputs:
        - content: |
            xcrun simctl boot "iPhone 16" 2>/dev/null || true
            $BITRISE_SOURCE_DIR/scripts/recording/start-ios-sim.sh booted \
              $BITRISE_SOURCE_DIR/recordings/ios-ui-tests.mov
    - xcode-test@6:
        inputs:
        - project_path: apps/ios/CounterApp.xcodeproj
        - scheme: CounterApp-UI
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - script@1:
        title: Stop recording and keep it as a build artifact
        is_always_run: true
        inputs:
        - content: |
            $BITRISE_SOURCE_DIR/scripts/recording/stop-ios-sim.sh \
              $BITRISE_SOURCE_DIR/recordings/ios-ui-tests.mov \
              $BITRISE_SOURCE_DIR/recordings/ios-ui-tests.mp4
            [ -s "$BITRISE_SOURCE_DIR/recordings/ios-ui-tests.mp4" ] \
              && cp "$BITRISE_SOURCE_DIR/recordings/ios-ui-tests.mp4" "$BITRISE_DEPLOY_DIR/ios-ui-tests-recording.mp4" \
              || echo "No recording to keep."
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios-maestro-e2e:
    summary: >
      Maestro E2E flows against the native iOS app on a simulator -- ports of
      the existing Android Maestro flows (e2e/maestro/), same journeys, new
      folder apps/ios/maestro/. Manual-trigger only (not added to the `ios`
      pipeline) to avoid adding simulator minutes to every push; start it
      from the Bitrise UI. See docs/new-test-scenarios-plan.md.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    before_run: [_ios_setup]
    steps:
    - xcode-build-for-simulator@3.0.3:
        inputs:
        # No bare "CounterApp" scheme exists -- project.yml only defines
        # CounterApp-Unit/CounterApp-UI. Either works for a build-only step
        # since we're not invoking the test action here.
        - project_path: apps/ios/CounterApp.xcodeproj
        - scheme: CounterApp-UI
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - script@1:
        title: Boot simulator for Maestro
        inputs:
        # bootstatus -b alone wasn't enough -- the SBMainWorkspace denial
        # persisted even after confirming full boot (build #108). This is a
        # known CI quirk: simctl launch-based tools need the actual
        # Simulator.app GUI process running, not just a headless-booted
        # device, or SpringBoard refuses to open the app.
        - content: |
            xcrun simctl boot "iPhone 16" 2>/dev/null || true
            xcrun simctl bootstatus "iPhone 16" -b
            open -a Simulator
            sleep 5
    - maestro-test@1:
        inputs:
        - app_path: $BITRISE_APP_DIR_PATH
        - flow_path: $BITRISE_SOURCE_DIR/apps/ios/maestro
        - test_name: Maestro E2E (iOS)
        - maestro_version: 2.11.0
        - num_flaky_test_attempts: 1
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios-fastlane-scan:
    summary: >
      Runs the XCUITest suite via fastlane's `scan` (apps/ios/fastlane/),
      a third way to run the exact same CounterApp-UI scheme alongside
      ios_ui_tests (native Step) and ios_ui_tests_manual (raw xcodebuild).
      scan writes a real JUnit XML directly (output_types: junit), so the
      recording gets a true Tests-tab attachment, same mechanism as
      ios_ui_tests_manual. Manual-trigger only, not in the `ios` pipeline.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    before_run: [_ios_setup]
    steps:
    - script@1:
        title: Install fastlane and start recording
        inputs:
        - content: |
            gem install fastlane -v '~> 2.223' --no-document
            xcrun simctl boot "iPhone 16" 2>/dev/null || true
            $BITRISE_SOURCE_DIR/scripts/recording/start-ios-sim.sh booted \
              $BITRISE_SOURCE_DIR/recordings/ios-fastlane-scan.mov
    - script@1:
        title: Run fastlane scan
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/ios
        - content: |
            set -eo pipefail
            mkdir -p test-results
            fastlane scan_xcuitest
    - script@1:
        title: Stop recording and attach it to the Tests tab
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/ios
        - content: |
            $BITRISE_SOURCE_DIR/scripts/recording/stop-ios-sim.sh \
              $BITRISE_SOURCE_DIR/recordings/ios-fastlane-scan.mov \
              $BITRISE_SOURCE_DIR/recordings/ios-fastlane-scan.mp4
            if [ -s "$BITRISE_SOURCE_DIR/recordings/ios-fastlane-scan.mp4" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" add-recording-testcase \
                --junit-xml test-results/xcuitest.xml \
                --classname CounterAppUITests.CounterUITests \
                --media "$BITRISE_SOURCE_DIR/recordings/ios-fastlane-scan.mp4" \
                --dest-dir test-results
            else
              echo "No recording found, exporting test results without a video attachment."
            fi
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: XCUITest UI tests (fastlane scan)
        - base_path: $BITRISE_SOURCE_DIR/apps/ios/test-results
        - search_pattern: "*/xcuitest.xml"
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios-appium-local:
    summary: >
      Appium against a local iOS Simulator + a local Appium server (XCUITest
      driver), covering 2-3 key journeys via the new
      e2e/appium/tests/test_counter_ios.py (scenario 5) -- a separate test
      file and `ios_driver` fixture, the existing Android test_counter.py
      and `driver` fixture are untouched. Manual-trigger only.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    before_run: [_ios_setup]
    steps:
    - script@1:
        title: Build for simulator and start local Appium server
        inputs:
        - content: |
            set -eo pipefail
            xcrun simctl boot "iPhone 16" 2>/dev/null || true
            xcrun simctl bootstatus "iPhone 16" -b
            # Headless-booted isn't enough for simctl-launch-based tools --
            # the Simulator.app GUI process needs to actually be running or
            # SpringBoard denies the launch (SBMainWorkspace, confirmed live
            # on ios-maestro-e2e #108 with an otherwise-successful boot).
            open -a Simulator
            sleep 5
            # Hand Appium the exact UDID of the simulator we just booted,
            # instead of a hardcoded platform_version -- the build step
            # below uses OS=latest, which drifts across stack updates and
            # previously caused "'18.0' does not exist in the list of
            # simctl SDKs" (confirmed live on build #102).
            IOS_SIM_UDID="$(xcrun simctl list devices booted -j \
              | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v if x['name']=='iPhone 16'))")"
            envman add --key APPIUM_IOS_UDID --value "$IOS_SIM_UDID"
            npm install -g appium@2.11.0
            appium driver install xcuitest@7.29.0
            nohup appium --base-path /wd/hub --allow-insecure chromedriver_autodownload \
              > /tmp/appium-server.log 2>&1 &
            echo $! > /tmp/appium-server.pid
            for _ in $(seq 1 30); do curl -sf http://localhost:4723/wd/hub/status && break; sleep 1; done
    - xcode-build-for-simulator@3.0.3:
        inputs:
        - project_path: apps/ios/CounterApp.xcodeproj
        - scheme: CounterApp-UI
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - script@1:
        title: Run Appium tests (local iOS)
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/e2e/appium
        - content: |
            set -eo pipefail
            export APPIUM_SERVER_URL=http://localhost:4723/wd/hub
            export APPIUM_IOS_APP_PATH="$BITRISE_APP_DIR_PATH"
            export APPIUM_IOS_DEVICE="iPhone 16"
            # APPIUM_IOS_UDID is already in the env, exported by envman in
            # the previous step.
            python3 -m venv .venv && . .venv/bin/activate
            pip install -q -r requirements.txt
            mkdir -p test-results
            pytest tests/test_counter_ios.py --junitxml=test-results/appium-ios-local.xml
    - script@1:
        title: Stop local Appium server
        is_always_run: true
        inputs:
        - content: kill "$(cat /tmp/appium-server.pid)" 2>/dev/null || true
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Appium on local iOS Simulator
        - base_path: $BITRISE_SOURCE_DIR/e2e/appium/test-results
        - search_pattern: "*/appium-ios-local.xml"
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios_ui_tests_manual:
    summary: >
      Same XCUITest suite as ios_ui_tests, but ("Approach B") driven by a
      manual `xcodebuild test` instead of the native Xcode Test Step, so we
      have full control of the simulator lifecycle and get a real JUnit XML
      (via xcpretty) to attach the recording to -- a true Tests-tab video
      attachment, at the cost of losing the native Step's xcresult
      auto-attachment and convenience. Manual-trigger only: this exists to
      demonstrate the alternative, not to double-run UI tests on every push.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    before_run: [_ios_setup]
    steps:
    - script@1:
        title: Boot simulator and start recording
        inputs:
        - content: |
            xcrun simctl boot "iPhone 16" 2>/dev/null || true
            gem list -i xcpretty >/dev/null 2>&1 || gem install xcpretty --no-document
            $BITRISE_SOURCE_DIR/scripts/recording/start-ios-sim.sh booted \
              $BITRISE_SOURCE_DIR/recordings/ios-ui-tests-manual.mov
    - script@1:
        title: Run xcodebuild test
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/ios
        - content: |
            set -o pipefail
            mkdir -p test-results
            xcodebuild test \
              -project CounterApp.xcodeproj \
              -scheme CounterApp-UI \
              -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
              | xcpretty --report junit --output test-results/xcuitest.xml
    - script@1:
        title: Stop recording and attach it to the Tests tab
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/ios
        - content: |
            $BITRISE_SOURCE_DIR/scripts/recording/stop-ios-sim.sh \
              $BITRISE_SOURCE_DIR/recordings/ios-ui-tests-manual.mov \
              $BITRISE_SOURCE_DIR/recordings/ios-ui-tests-manual.mp4
            if [ -s "$BITRISE_SOURCE_DIR/recordings/ios-ui-tests-manual.mp4" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" add-recording-testcase \
                --junit-xml test-results/xcuitest.xml \
                --classname CounterAppUITests.CounterUITests \
                --media "$BITRISE_SOURCE_DIR/recordings/ios-ui-tests-manual.mp4" \
                --dest-dir test-results
            else
              echo "No recording found, exporting test results without a video attachment."
            fi
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: XCUITest UI tests (manual xcodebuild)
        - base_path: $BITRISE_SOURCE_DIR/apps/ios/test-results
        - search_pattern: "*/xcuitest.xml"
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios-xcuitest-shard-build:
    summary: >
      Stage 1/3 of the sharded XCUITest pipeline (scenario 3a): builds the
      CounterApp-UI test bundle once with xcode-build-for-test, shared with
      the other stages via pipeline intermediate files. Part of the
      ios_xcuitest_sharded pipeline -- don't start this workflow directly.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    before_run: [_ios_setup]
    steps:
    - xcode-build-for-test@3.6.0:
        inputs:
        - project_path: apps/ios/CounterApp.xcodeproj
        - scheme: CounterApp-UI
        - destination: generic/platform=iOS Simulator
        - automatic_code_signing: "off"
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
        inputs:
        - pipeline_intermediate_files: |-
            BITRISE_TEST_BUNDLE_PATH
            BITRISE_XCTESTRUN_FILE_PATH

  ios-xcuitest-shard-calc:
    summary: >
      Stage 2/3: calculates N test shards (XCUITEST_SHARD_COUNT env var,
      default 2 -- this app's CounterApp-UI target only has 2 test methods,
      see docs/new-test-scenarios-plan.md) from the test bundle built in
      stage 1.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    steps:
    - pull-intermediate-files@1.3.7:
        inputs:
        - artifact_sources: ios-xcuitest-shard-build
    - xcode-test-shard-calculation@0.2.1:
        inputs:
        - product_path: $BITRISE_TEST_BUNDLE_PATH
        - shard_count: $XCUITEST_SHARD_COUNT
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
        inputs:
        - pipeline_intermediate_files: |-
            BITRISE_TEST_SHARDS_PATH
            BITRISE_XCTESTRUN_FILE_PATH
            BITRISE_TEST_BUNDLE_PATH

  ios-xcuitest-shard-1:
    summary: >
      Stage 3/3, shard 1 of XCUITEST_SHARD_COUNT. Reports its own Tests tab
      entry, separate from shard 2's.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    steps:
    - pull-intermediate-files@1.3.7:
        inputs:
        - artifact_sources: ios-xcuitest-shard-calc
    - script@1:
        title: Boot simulator
        inputs:
        - content: xcrun simctl boot "iPhone 16" 2>/dev/null || true
    - xcode-test-without-building@1.0.1:
        inputs:
        - xctestrun: $BITRISE_XCTESTRUN_FILE_PATH
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
        # xcode-test-shard-calculation writes one file per shard under
        # $BITRISE_TEST_SHARDS_PATH; exact naming confirmed via a live run
        # (see docs/new-test-scenarios-plan.md for the final value).
        - only_testing: $BITRISE_TEST_SHARDS_PATH/shard_1.txt
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios-xcuitest-shard-2:
    summary: >
      Stage 3/3, shard 2 of XCUITEST_SHARD_COUNT. Reports its own Tests tab
      entry, separate from shard 1's.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    steps:
    - pull-intermediate-files@1.3.7:
        inputs:
        - artifact_sources: ios-xcuitest-shard-calc
    - script@1:
        title: Boot simulator
        inputs:
        - content: xcrun simctl boot "iPhone 16" 2>/dev/null || true
    - xcode-test-without-building@1.0.1:
        inputs:
        - xctestrun: $BITRISE_XCTESTRUN_FILE_PATH
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
        - only_testing: $BITRISE_TEST_SHARDS_PATH/shard_2.txt
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
