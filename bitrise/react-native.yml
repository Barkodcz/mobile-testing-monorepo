# React Native module: Jest + React Native Testing Library, Detox E2E on an iOS simulator.
format_version: "13"

pipelines:
  react_native:
    workflows:
      rn_jest_tests: {}
      rn_detox_ios:
        depends_on: [rn_jest_tests]       # only spend macOS minutes if Jest is green
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^(apps/react-native/.*|bitrise/react-native\.yml)$'
      pull_request:
      - draft_enabled: false
        changed_files:
          regex: '^(apps/react-native/.*|bitrise/react-native\.yml)$'

workflows:
  rn_jest_tests:
    summary: Jest unit, component and snapshot tests (Linux, no simulator).
    steps:
    - git-clone@8.5.2: {}
    - restore-npm-cache@3.0.2: {}
    - npm@3.1.0:
        inputs:
        - workdir: $BITRISE_SOURCE_DIR/apps/react-native
        - command: ci
    - script@1.2.1:
        title: Run Jest
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/react-native
        - content: |
            set -eo pipefail
            # jest.config.js adds the jest-junit reporter -> test-results/jest-junit.xml
            npx jest --ci
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Jest (React Native)
        - base_path: $BITRISE_SOURCE_DIR/apps/react-native/test-results
        - search_pattern: "*/jest-junit.xml"
    - save-npm-cache@1.2.1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  rn_detox_ios:
    summary: Detox E2E tests on an iOS simulator (release build).
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    steps:
    - git-clone@8.5.2: {}
    - restore-npm-cache@3.0.2: {}
    - npm@3.1.0:
        inputs:
        - workdir: $BITRISE_SOURCE_DIR/apps/react-native
        - command: ci
    - cocoapods-install@3.1.1:
        inputs:
        - source_root_path: $BITRISE_SOURCE_DIR/apps/react-native/ios
    - script@1.2.1:
        title: Build and run Detox
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/react-native
        - content: |
            set -eo pipefail
            command -v applesimutils >/dev/null 2>&1 || { brew tap wix/brew && brew install wix/brew/applesimutils; }
            npx detox build --configuration ios.sim.release
            # --take-screenshots all: the explicit device.takeScreenshot() calls in the
            # tests are no-ops on disk under "failing" mode unless the test actually fails.
            # --record-videos maps $RECORD_VIDEO (all|failures|off) to Detox's own
            # keep-only-on-failure mode (all|failing|none).
            case "${RECORD_VIDEO:-failures}" in
              all) DETOX_VIDEO_MODE=all ;;
              off) DETOX_VIDEO_MODE=none ;;
              *) DETOX_VIDEO_MODE=failing ;;
            esac
            npx detox test --configuration ios.sim.release --cleanup --record-logs failing \
              --take-screenshots all --record-videos "$DETOX_VIDEO_MODE"
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Detox E2E (iOS)
        - base_path: $BITRISE_SOURCE_DIR/apps/react-native/test-results
        - search_pattern: "*/detox-junit.xml"
    - script@1.2.1:
        title: Keep Detox artifacts as a browsable zip too
        is_always_run: true
        inputs:
        # deploy-to-bitrise-io only picks up files in the deploy dir, not raw
        # copied directories, so zip instead of cp -r. The per-test-case
        # attachments themselves come from custom-test-results-export above,
        # matching bitrisePathBuilder.js's naming convention under test-results/.
        - content: zip -qr "$BITRISE_DEPLOY_DIR/detox-artifacts.zip" apps/react-native/test-results 2>/dev/null || true
    - save-npm-cache@1.2.1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  android-maestro-e2e-rn:
    summary: >
      Maestro flows against the React Native app's Android build -- covers
      the same journeys as the Detox suite above, see
      apps/react-native/maestro/README.md for the test-by-test mapping.
      Manual-trigger only, not added to the `react_native` pipeline, so it
      doesn't add emulator minutes to every push alongside Detox.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large
    steps:
    - git-clone@8.5.2: {}
    - restore-npm-cache@3.0.2: {}
    - npm@3.1.0:
        inputs:
        - workdir: $BITRISE_SOURCE_DIR/apps/react-native
        - command: ci
    - avd-manager@2.2.0:
        inputs:
        - profile: pixel_6
        - api_level: "34"
        - tag: google_apis
        - abi: x86_64
    - script@1.2.1:
        # Release, not debug: debug builds need the Metro bundler running to
        # render anything (classic RN gotcha -- confirmed live: a debug APK
        # here showed neither "Count: 0" nor increment_button at all).
        # Release embeds the JS bundle; the project's signingConfig already
        # points release at the debug keystore, so it installs fine as-is.
        title: Build release APK
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/react-native/android
        - content: ./gradlew :app:assembleRelease
    - wait-for-android-emulator@1.0.10: {}
    - maestro-test@1.2.0:
        inputs:
        - app_path: $BITRISE_SOURCE_DIR/apps/react-native/android/app/build/outputs/apk/release/app-release.apk
        - flow_path: $BITRISE_SOURCE_DIR/apps/react-native/maestro
        - test_name: Maestro E2E (React Native / Android)
        - maestro_version: 2.11.0
        - num_flaky_test_attempts: 1
    - save-npm-cache@1.2.1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  ios-maestro-e2e-rn:
    summary: >
      Same Maestro flows as android-maestro-e2e-rn, against the React Native
      app's iOS build. Overrides the flow files' Android appId at runtime
      since one set of flows covers both platforms -- see
      apps/react-native/maestro/README.md. Manual-trigger only.
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    steps:
    - git-clone@8.5.2: {}
    - restore-npm-cache@3.0.2: {}
    - npm@3.1.0:
        inputs:
        - workdir: $BITRISE_SOURCE_DIR/apps/react-native
        - command: ci
    - cocoapods-install@3.1.1:
        inputs:
        - source_root_path: $BITRISE_SOURCE_DIR/apps/react-native/ios
    - xcode-build-for-simulator@3.0.3:
        inputs:
        # Release, not the scheme's default Debug: same reason as the
        # Android build above -- Debug needs Metro bundler running to
        # render anything. Release embeds the JS bundle (same as rn_detox_ios).
        - project_path: apps/react-native/ios/CounterRN.xcworkspace
        - scheme: CounterRN
        - configuration: Release
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - script@1.2.1:
        title: Ad-hoc codesign the built app
        inputs:
        # xcode-build-for-simulator disables signing (CODE_SIGNING_ALLOWED=NO).
        # xcodebuild test tolerates an unsigned app since its own test
        # harness does the launching, but a bare `simctl launch` (what
        # Maestro does) was denied by SpringBoard on iOS 18.x simulators for
        # an unsigned app -- "SBMainWorkspace" (confirmed live, same root
        # cause as ios-maestro-e2e). Ad-hoc signing fixes it.
        - content: codesign --force --deep --sign - "$BITRISE_APP_DIR_PATH"
    - script@1.2.1:
        title: Boot simulator for Maestro
        inputs:
        - content: |
            xcrun simctl boot "iPhone 16" 2>/dev/null || true
            xcrun simctl bootstatus "iPhone 16" -b
    - maestro-test@1.2.0:
        inputs:
        - app_path: $BITRISE_APP_DIR_PATH
        - flow_path: $BITRISE_SOURCE_DIR/apps/react-native/maestro
        - test_name: Maestro E2E (React Native / iOS)
        - maestro_version: 2.11.0
        - num_flaky_test_attempts: 1
        - additional_args: --app-id org.reactjs.native.example.CounterRN
    - save-npm-cache@1.2.1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
