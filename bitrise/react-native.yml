# React Native module: Jest + React Native Testing Library, Detox E2E on an iOS simulator.
format_version: "13"

pipelines:
  react_native:
    workflows:
      rn_jest_tests: {}
      rn_detox_ios:
        depends_on: [rn_jest_tests]       # only spend macOS minutes if Jest is green
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^(apps/react-native/.*|bitrise/react-native\.yml)$'
      pull_request:
      - draft_enabled: false
        changed_files:
          regex: '^(apps/react-native/.*|bitrise/react-native\.yml)$'

workflows:
  rn_jest_tests:
    summary: Jest unit, component and snapshot tests (Linux, no simulator).
    steps:
    - git-clone@8: {}
    - restore-npm-cache@2: {}
    - npm@1:
        inputs:
        - workdir: $BITRISE_SOURCE_DIR/apps/react-native
        - command: ci
    - script@1:
        title: Run Jest
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/react-native
        - content: |
            set -eo pipefail
            # jest.config.js adds the jest-junit reporter -> test-results/jest-junit.xml
            npx jest --ci
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Jest (React Native)
        - base_path: $BITRISE_SOURCE_DIR/apps/react-native/test-results
        - search_pattern: "*/jest-junit.xml"
    - save-npm-cache@1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  rn_detox_ios:
    summary: Detox E2E tests on an iOS simulator (release build).
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.medium
    steps:
    - git-clone@8: {}
    - restore-npm-cache@2: {}
    - npm@1:
        inputs:
        - workdir: $BITRISE_SOURCE_DIR/apps/react-native
        - command: ci
    - cocoapods-install@2:
        inputs:
        - source_root_path: $BITRISE_SOURCE_DIR/apps/react-native/ios
    - script@1:
        title: Build and run Detox
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/react-native
        - content: |
            set -eo pipefail
            command -v applesimutils >/dev/null 2>&1 || { brew tap wix/brew && brew install wix/brew/applesimutils; }
            npx detox build --configuration ios.sim.release
            # --take-screenshots all: the explicit device.takeScreenshot() calls in the
            # tests are no-ops on disk under "failing" mode unless the test actually fails.
            # --record-videos maps $RECORD_VIDEO (all|failures|off) to Detox's own
            # keep-only-on-failure mode (all|failing|none).
            case "${RECORD_VIDEO:-failures}" in
              all) DETOX_VIDEO_MODE=all ;;
              off) DETOX_VIDEO_MODE=none ;;
              *) DETOX_VIDEO_MODE=failing ;;
            esac
            npx detox test --configuration ios.sim.release --cleanup --record-logs failing \
              --take-screenshots all --record-videos "$DETOX_VIDEO_MODE"
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Detox E2E (iOS)
        - base_path: $BITRISE_SOURCE_DIR/apps/react-native/test-results
        - search_pattern: "*/detox-junit.xml"
    - script@1:
        title: Keep Detox artifacts as a browsable zip too
        is_always_run: true
        inputs:
        # deploy-to-bitrise-io only picks up files in the deploy dir, not raw
        # copied directories, so zip instead of cp -r. The per-test-case
        # attachments themselves come from custom-test-results-export above,
        # matching bitrisePathBuilder.js's naming convention under test-results/.
        - content: zip -qr "$BITRISE_DEPLOY_DIR/detox-artifacts.zip" apps/react-native/test-results 2>/dev/null || true
    - save-npm-cache@1: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
