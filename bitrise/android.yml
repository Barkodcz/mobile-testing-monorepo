# Android module: JUnit unit tests, Paparazzi snapshots, Compose UI tests on an emulator.
format_version: "13"

pipelines:
  android:
    workflows:
      android_unit_tests: {}
      android_snapshot_tests: {}
      android_ui_tests: {}
    triggers:
      push:
      - branch: main
        changed_files:
          regex: '^(apps/android/.*|bitrise/android\.yml)$'
      pull_request:
      - draft_enabled: false
        changed_files:
          regex: '^(apps/android/.*|bitrise/android\.yml)$'

workflows:
  android_unit_tests:
    summary: JVM unit tests with JUnit (testDebugUnitTest).
    steps:
    - git-clone@8.5.2: {}
    - restore-gradle-cache@3.1.2: {}
    - android-unit-test@1.3.0:                # exports to the Tests tab automatically
        inputs:
        - project_location: $BITRISE_SOURCE_DIR/apps/android
        - module: app
        - variant: debug
    - save-gradle-cache@1.6.2: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  android_snapshot_tests:
    summary: Paparazzi screenshot tests, compared with the committed snapshots.
    steps:
    - git-clone@8.5.2: {}
    - restore-gradle-cache@3.1.2: {}
    - script@1.2.1:
        title: Verify Paparazzi snapshots
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/android
        - content: |
            set -eo pipefail
            ./gradlew :app:verifyPaparazziDebug
    - script@1.2.1:
        title: Merge JUnit XML and keep diff images
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/android
        - content: |
            set -eo pipefail
            mkdir -p test-results
            # Gradle writes one XML per test class; the export step takes one file.
            npx --yes junit-report-merger test-results/paparazzi.xml "app/build/test-results/testDebugUnitTest/*.xml"
            # BitriseSnapshotHandler (BitrisePaparazzi.kt) already names these
            # per the <classname>__<name>__<label>.png convention; copying
            # them flat into the export base_path is enough for
            # custom-test-results-export to attach them to their test case.
            cp app/build/bitrise-snapshots/*/*.png test-results/ 2>/dev/null || true
            # Keep the full failures dir as a browsable artifact too (zipped,
            # since deploy-to-bitrise-io ignores raw copied directories).
            zip -qr "$BITRISE_DEPLOY_DIR/paparazzi-failures.zip" app/build/paparazzi/failures 2>/dev/null || true
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Paparazzi snapshots
        - base_path: $BITRISE_SOURCE_DIR/apps/android/test-results
        - search_pattern: "*/paparazzi.xml"
    - save-gradle-cache@1.6.2: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  android_record_snapshots:
    summary: Manual helper. Records Paparazzi snapshots on CI so you can download and commit them.
    steps:
    - git-clone@8.5.2: {}
    - script@1.2.1:
        title: Record Paparazzi snapshots
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/android
        - content: |
            set -eo pipefail
            ./gradlew :app:recordPaparazziDebug
            cd app/src/test && zip -r "$BITRISE_DEPLOY_DIR/paparazzi-snapshots.zip" snapshots
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  android_ui_tests:
    summary: >
      Compose UI tests (instrumented) on an Android emulator, with the whole
      run's screen recording attached to a synthetic test case in the Tests
      tab. Switched from the native android-instrumented-test Step to a
      Gradle script + the generic export route, so the recording can be
      wrapped around the run and attached by filename convention (see
      docs/test-recording-plan.md).
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large   # the emulator needs more RAM
    steps:
    - git-clone@8.5.2: {}
    - restore-gradle-cache@3.1.2: {}
    - avd-manager@2.2.0:                      # boots in the background while we build
        inputs:
        - profile: pixel_6
        - api_level: "34"
        - tag: google_apis
        - abi: x86_64
    - wait-for-android-emulator@1.0.10: {}
    - script@1.2.1:
        title: Start screen recording
        inputs:
        - content: $BITRISE_SOURCE_DIR/scripts/recording/start-android.sh /sdcard/bitrise-recordings ui-tests
    - script@1.2.1:
        title: Run instrumented UI tests
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/android
        - content: |
            set -eo pipefail
            ./gradlew :app:connectedDebugAndroidTest
    - script@1.2.1:
        title: Stop screen recording
        is_always_run: true
        inputs:
        - content: |
            SCREENSHOT="$($BITRISE_SOURCE_DIR/scripts/recording/screenshot-android.sh \
              $BITRISE_SOURCE_DIR/recordings/ui-tests-final.png)"
            [ -n "$SCREENSHOT" ] && echo "Took a final-state screenshot: $SCREENSHOT"
            $BITRISE_SOURCE_DIR/scripts/recording/stop-android.sh /sdcard/bitrise-recordings $BITRISE_SOURCE_DIR/recordings
    - script@1.2.1:
        title: Merge JUnit XML and attach the recording
        is_always_run: true
        inputs:
        - working_dir: $BITRISE_SOURCE_DIR/apps/android
        - content: |
            set -eo pipefail
            mkdir -p test-results
            npx --yes junit-report-merger test-results/instrumented.xml \
              "app/build/outputs/androidTest-results/connected/**/TEST-*.xml"
            if [ -s "$BITRISE_SOURCE_DIR/recordings/ui-tests-final.png" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" add-recording-testcase \
                --junit-xml test-results/instrumented.xml \
                --classname io.bitrise.sample.counter.CounterScreenUiTest \
                --media "$BITRISE_SOURCE_DIR/recordings/ui-tests-final.png" \
                --label screenshot --always \
                --dest-dir test-results
            fi
            RECORDING="$("$BITRISE_SOURCE_DIR/scripts/recording/concat-chunks.sh" \
              "$BITRISE_SOURCE_DIR/recordings/bitrise-recordings/ui-tests_chunk*.mp4" \
              "$BITRISE_SOURCE_DIR/recordings/ui-tests_combined.mp4")"
            if [ -n "$RECORDING" ]; then
              python3 "$BITRISE_SOURCE_DIR/scripts/reporting/attach_media_to_junit.py" add-recording-testcase \
                --junit-xml test-results/instrumented.xml \
                --classname io.bitrise.sample.counter.CounterScreenUiTest \
                --media "$RECORDING" \
                --dest-dir test-results
            else
              echo "No recording found, exporting test results without a video attachment."
            fi
    - custom-test-results-export@2.0.0:
        is_always_run: true
        inputs:
        - test_name: Compose UI tests (Android)
        - base_path: $BITRISE_SOURCE_DIR/apps/android/test-results
        - search_pattern: "*/instrumented.xml"
    - save-gradle-cache@1.6.2: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true

  android-espresso-vdt:
    summary: >
      Runs the existing Espresso/Compose UI tests (CounterScreenUiTest.kt,
      same tests as android_ui_tests) through Bitrise's Virtual Device
      Testing add-on (Firebase Test Lab) instead of a local emulator.
      android_ui_tests is untouched. Manual-trigger only.

      BLOCKER: needs the Virtual Device Testing add-on enabled on this app
      (Bitrise dashboard -> app -> Add-ons), which provisions
      $ADDON_VDTESTING_API_TOKEN automatically -- no Firebase/GCP service
      account needed, VDT's api_token input already defaults to that Env
      Var. Written and ready, but unverified until the add-on is enabled.
      See docs/new-test-scenarios-plan.md.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    steps:
    - git-clone@8.5.2: {}
    - restore-gradle-cache@3.1.2: {}
    - android-build-for-ui-testing@1.0.0:
        inputs:
        - project_location: $BITRISE_SOURCE_DIR/apps/android
        - module: app
        - variant: debug
    - virtual-device-testing-for-android@1.3.6:
        inputs:
        - test_type: instrumentation
        - app_path: $BITRISE_APK_PATH
        - test_apk_path: $BITRISE_TEST_APK_PATH
        # One cheap device by default to keep VDT cost low; override by
        # setting VDT_DEVICE_LIST at the app/workflow level in the Bitrise UI.
        - test_devices: $VDT_DEVICE_LIST
        - download_test_results: "true"
    - save-gradle-cache@1.6.2: {}
    - deploy-to-bitrise-io@2.26.2:
        is_always_run: true
